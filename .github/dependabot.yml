# Weekly dependency updates, one grouped pull request per ecosystem. A release waits seven days
# before Dependabot proposes it, so a compromised one has time to be caught and pulled; security
# updates skip the wait.
version: 2
updates:
  # `/fuzz`: the fuzz targets' own lockfile, which pins the crates' dependencies too, at the
  # versions the main one does.
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
