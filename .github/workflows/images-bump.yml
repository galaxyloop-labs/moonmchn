# Weekly, or by hand for a CVE: moves `images/flake.lock` to the newest nixpkgs-unstable, tries
# every image behind it on both platforms, one job each, and commits to `main` the revisions that
# passed and the list of those held back. That push runs images-publish, which republishes each
# image whose content changed.
#
# Needs a GitHub App with contents: write that may push to `main`, its id in the variable
# IMAGES_BUMP_APP_ID and its private key in the secret IMAGES_BUMP_APP_PRIVATE_KEY: a push made
# with GITHUB_TOKEN would not run images-publish.
name: images-bump

on:
  schedule:
    # Mondays, 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: images-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    outputs:
      stale: ${{ steps.stale.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install

      - run: nix flake update --flake ./images

      - id: stale
        run: echo "names=$(.github/scripts/images-revisions.sh stale)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-flake-lock
          path: images/flake.lock
          retention-days: 1

  try:
    needs: lock
    if: needs.lock.outputs.stale != '[]'
    uses: ./.github/workflows/images-build.yml
    with:
      names: ${{ needs.lock.outputs.stale }}
      bumped: true

  # Runs even when some tries failed: those images stay on their revision, listed as held.
  record:
    needs: [lock, try]
    if: ${{ !cancelled() && needs.lock.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.IMAGES_BUMP_APP_ID }}
          private-key: ${{ secrets.IMAGES_BUMP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          # The held list dates each revision from its file's history.
          fetch-depth: 0

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-flake-lock
          path: images

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: passed-*
          path: passed

      # An image moves to the new revision once it passed on every platform.
      - run: |
          systems=$(nix eval --json ./images#packages --apply builtins.attrNames | jq -r '.[]')
          for name in $(jq -r '.[]' <<<"$STALE"); do
            passed_everywhere=true
            for system in $systems; do
              [[ -f "passed/passed-$name-$system/passed" ]] || passed_everywhere=false
            done
            if $passed_everywhere; then
              .github/scripts/images-revisions.sh pin "$name"
            fi
          done
          .github/scripts/images-revisions.sh held
        env:
          STALE: ${{ needs.lock.outputs.stale }}

      - run: |
          if git diff --quiet; then
            echo "Nothing moved"
            exit 0
          fi
          rev=$(jq -r '.nodes.nixpkgs.locked.rev' images/flake.lock)
          user_id=$(gh api "/users/$SLUG%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${user_id}+${SLUG}[bot]@users.noreply.github.com"
          git commit --all --message "chore(images): bump nixpkgs to ${rev:0:12}" \
            --message "$(sed -n '/^### Held directories/,/^## /p' images/README.md | sed '1d;$d')"
          git push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
