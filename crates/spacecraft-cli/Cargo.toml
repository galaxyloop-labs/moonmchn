[package]
name = "spacecraft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Spacecraft library and command-line interface"
license.workspace = true
readme.workspace = true

[[bin]]
name = "spacecraft"
path = "src/main.rs"
# The library owns API docs at target/doc/spacecraft; the CLI has --help.
doc = false

[dependencies]
spacecraft = { version = "0.1.0", path = "../spacecraft" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
toml = "1.1"

[lints]
workspace = true
