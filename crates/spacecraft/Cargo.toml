[package]
name = "spacecraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Spacecraft configuration and application library"
license.workspace = true
readme.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
toml = "1.1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
rustix = { version = "1", features = ["net", "process", "stdio"] }
tokio = { version = "1", features = [
  "rt",
  "net",
  "io-util",
  "sync",
  "macros",
  "signal",
  "time",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
