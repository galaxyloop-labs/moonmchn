[package]
name = "moonmchn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Moon MCHN configuration and application library"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["microvm", "sandbox", "ai-agents", "virtualization", "dev-tool"]
categories = ["virtualization"]

[dependencies]
idna = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
toml = "1.1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
getrandom = "0.4"
rustix = { version = "1", features = ["net", "process", "stdio"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio = { version = "1", features = [
  "rt",
  "net",
  "io-util",
  "sync",
  "macros",
  "signal",
  "time",
] }

[target.'cfg(unix)'.dev-dependencies]
# Paused time, so a test of the decider's 5 s deadline passes at once.
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
