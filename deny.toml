# Configuration for `cargo deny check`. See `make deny`.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# ISC, BSD-3-Clause and CDLA-Permissive-2.0 come with the TLS stack of the
# smolmachines SDK: ring, rustls-webpki, untrusted, subtle and webpki-roots.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
