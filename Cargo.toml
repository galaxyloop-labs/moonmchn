[workspace]
members = [
  "crates/moonmchn",
  "crates/moonmchn-smolmachines",
  "crates/moonmchn-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/galaxyloop-labs/moonmchn"
homepage = "https://github.com/galaxyloop-labs/moonmchn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
unreachable_pub = "deny"
unfulfilled_lint_expectations = "deny"
# `cargo fuzz` builds the crates with `--cfg fuzzing`, which exposes the fuzz targets' entry points.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Selected restriction lints
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
fn_to_numeric_cast_any = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
panic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
print_stderr = "deny"
print_stdout = "deny"
rest_pat_in_fully_bound_structs = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

# Selected nursery lints
debug_assert_with_mut_call = "deny"
fallible_impl_from = "deny"
large_stack_frames = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
redundant_clone = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"

# Selected cargo lints
wildcard_dependencies = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
