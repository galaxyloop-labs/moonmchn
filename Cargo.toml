[package]
name = "spacecraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Spacecraft library and command-line interface"
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "spacecraft"
path = "src/lib.rs"

[[bin]]
name = "spacecraft"
path = "src/bin/spacecraft/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Pulls in the argument parser and error reporting used only by the binary.
# Library consumers opt out with `default-features = false`.
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
